function renderCommands(){const query=$('search').value.trim().toLowerCase();$('commands').innerHTML=DATA.tools.filter(tool=>(query||tool.group===group)&&(!query||(t(tool.title)+' '+tool.id).toLowerCase().includes(query))).map(tool=>`<button data-open="${escape(tool.id)}" title="${escape(t(tool.description,''))}"><span class="glyph">◇</span>${escape(t(tool.title,tool.id))}</button>`).join('')}
function open(id){let doc=docs.find(d=>d.id===id);if(!doc){const tool=DATA.tools.find(t=>t.id===id);doc={...tool,values:Object.fromEntries(tool.fields.map(f=>[f.id,f.kind==='Bool'?String(f.default).toLowerCase()==='true':f.default??''])),output:'',width:285};docs.push(doc)}selected=id;group=doc.group;render();status(tx('文档已打开，输入和结果独立保留。','Document opened. Inputs and results are kept independently.'))}
function renderDocs(){$('documents').innerHTML=docs.map(d=>`<button class="${d.id===selected?'active':''}" data-select="${escape(d.id)}" draggable="true">${escape(t(d.title,d.id))}<span class="close" data-close="${escape(d.id)}">×</span></button>`).join('');let visible=docs.filter(d=>d.id===selected);if(split&&docs.length>1)visible.push(docs.find(d=>d.id!==selected));$('panes').innerHTML=visible.length?visible.map(pane).join(''):`<div class="empty">${escape(tx('从上方 Ribbon 选择工具，开始新的文档。','Choose a tool from the Ribbon to start a document.'))}</div>`;document.querySelectorAll('.divider').forEach(div=>div.onpointerdown=e=>{const parent=div.parentElement;div.setPointerCapture(e.pointerId);div.onpointermove=move=>{const width=Math.max(210,Math.min(440,parent.getBoundingClientRect().right-move.clientX));parent.style.setProperty('--properties',width+'px');docs.find(d=>d.id===parent.dataset.doc).width=width};div.onpointerup=()=>div.onpointermove=null})}
function field(d,f){const value=d.values[f.id]??'',label=escape(t(f.label,f.id));return `<label>${label}</label>`+(f.kind==='Multi'?`<textarea data-field="${escape(f.id)}">${escape(value)}</textarea>`:f.kind==='Bool'?`<input type="checkbox" data-field="${escape(f.id)}" ${value?'checked':''}>`:f.kind==='Select'?`<select data-field="${escape(f.id)}">${(f.options||[]).map(o=>`<option value="${escape(o.value)}" ${value===o.value?'selected':''}>${escape(t(o.label,o.value))}</option>`).join('')}</select>`:`<input data-field="${escape(f.id)}" type="${f.kind==='Number'?'number':'text'}" value="${escape(value)}">`)}
function pane(d){return `<section class="pane" data-doc="${escape(d.id)}" style="--properties:${d.width}px"><div class="tool-heading"><h2>${escape(t(d.title,d.id))}</h2><div class="muted">${escape(t(d.description,''))}</div></div><div class="editor">${d.fields.filter(f=>f.kind==='Multi').map(f=>`<div class="input-field">${field(d,f)}</div>`).join('')}<div class="card"><label>${escape(tx('结果','Result'))}<button style="float:right" data-copy="${escape(d.id)}">${escape(tx('复制','Copy'))}</button></label><pre class="output">${escape(d.output||tx('运行工具后，结果显示在这里。','Run the tool to see its result.'))}</pre></div></div><div class="divider" aria-label="${escape(tx('调整属性宽度','Resize properties'))}"></div><aside><h3>${escape(w('Properties'))}</h3>${d.fields.filter(f=>f.kind!=='Multi').map(f=>`<div>${field(d,f)}</div>`).join('')}<button class="primary" data-run="${escape(d.id)}">${escape(tx('运行','Run'))}</button><p class="muted">${escape(tx('该文档的输入与结果独立保留。','This document keeps its own input and result.'))}</p></aside></section>`}
async function run(id){const d=docs.find(d=>d.id===id),input=String(Object.values(d.values).find(v=>typeof v==='string')||'');try{if(/base64/i.test(id)){const decode=Object.values(d.values).includes('Decode');d.output=decode?new TextDecoder().decode(Uint8Array.from(atob(input),c=>c.charCodeAt(0))):btoa(String.fromCharCode(...new TextEncoder().encode(input)))}else if(/json/i.test(id)){d.output=JSON.stringify(JSON.parse(input||'{"hello":"CodeWF"}'),null,2)}else if(/guid|uuid/i.test(id)){d.output=crypto.randomUUID()}else if(/case/i.test(id)){d.output=input.toUpperCase()+'\n'+input.toLowerCase()}else if(/url/i.test(id)){d.output=encodeURIComponent(input)}else if(/hash/i.test(id)){d.output=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input)))].map(x=>x.toString(16).padStart(2,'0')).join('')}else{d.output=tx('原型演示：文档、输入、属性和结果已保留。文件、网络及其他算法请在桌面应用中运行。','Prototype demo: document, inputs, properties and results are preserved. Run file, network and other algorithms in the desktop app.')+'\n'+input}status(tx('运行完成','Completed'))}catch(e){d.output=tx('输入无效：','Invalid input: ')+e.message;status(d.output)}renderDocs()}
document.addEventListener('click',e=>{const target=e.target.closest('button,span[data-close]');if(!target)return;if(target.dataset.close){docs=docs.filter(d=>d.id!==target.dataset.close);if(selected===target.dataset.close)selected=docs.at(-1)?.id;render();return}if(target.dataset.group){group=target.dataset.group;render()}if(target.dataset.open)open(target.dataset.open);if(target.dataset.select){selected=target.dataset.select;renderDocs()}if(target.dataset.run)run(target.dataset.run);if(target.dataset.copy){const d=docs.find(d=>d.id===target.dataset.copy);navigator.clipboard?.writeText(d.output).then(()=>status(tx('已复制','Copied'))).catch(()=>status(tx('当前浏览器未允许剪贴板，请选中结果复制。','Select the result and copy; clipboard access is unavailable.')))}});
document.addEventListener('input',e=>{if(e.target.dataset.field){const d=docs.find(d=>d.id===e.target.closest('[data-doc]').dataset.doc);d.values[e.target.dataset.field]=e.target.type==='checkbox'?e.target.checked:e.target.value}});
document.addEventListener('change',e=>{const id=e.target.dataset.appearance||e.target.id;if(id==='palette')palette=e.target.value;if(id==='mode')mode=e.target.value;if(id==='language')lang=e.target.value;if(['palette','mode','language'].includes(id))render();if(id==='scenario'){updateState='idle';retry=false;$('notice').textContent='';render()}});
$('title-mode').onclick=()=>{mode=({System:'Light',Light:'Dark',Dark:'System'})[mode];render();};document.addEventListener('click',e=>{const paletteButton=e.target.closest('[data-title-palette]'),languageButton=e.target.closest('[data-title-language]');if(paletteButton){palette=paletteButton.dataset.titlePalette;render();}if(languageButton){lang=languageButton.dataset.titleLanguage;render();$('title-language').open=false;}if(!e.target.closest('#title-language'))$('title-language').open=false;});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('title-language').open=false;});
$('search').oninput=renderCommands;$('split').onclick=()=>{split=!split;renderDocs()};$('close-all').onclick=()=>{docs=[];selected=null;render()};$('settings').onclick=()=>$('settings-dialog').showModal();$('about').onclick=()=>$('about-dialog').showModal();$('close-about').onclick=()=>{cancelUpdate();$('about-dialog').close()};
let dragged=null;document.addEventListener('dragstart',e=>dragged=e.target.closest('[data-select]')?.dataset.select);document.addEventListener('dragover',e=>{if(e.target.closest('[data-select]'))e.preventDefault()});document.addEventListener('drop',e=>{const target=e.target.closest('[data-select]')?.dataset.select;if(dragged&&target){const d=docs.find(d=>d.id===dragged);docs.splice(docs.indexOf(d),1);docs.splice(docs.findIndex(d=>d.id===target),0,d);renderDocs()}});
function cancelUpdate(){if(operation)clearInterval(operation);operation=null;if(['checking','downloading','installing'].includes(updateState)){updateState='canceled';$('notice').textContent=u('AboutCanceled')}$('cancel-update').hidden=true;$('progress').hidden=true;$('update').disabled=false;render()}
$('cancel-update').onclick=cancelUpdate;
$('update').onclick=()=>{const scenario=$('scenario').value;if(updateState==='available'&&scenario==='missing'){$('notice').textContent=tx('桌面应用将打开发布页；离线原型保留在当前页面。','The desktop app opens the release page; this offline prototype stays here.');return}const phase=updateState==='downloaded'?'installing':updateState==='available'?'downloading':updateState==='failed'&&retry?retry:'checking';updateState=phase;$('update').disabled=true;$('cancel-update').hidden=false;$('notice').textContent=u(phase==='checking'?'AboutChecking':phase==='downloading'?'AboutDownloading':'AboutInstalling');let p=0;$('progress').hidden=phase!=='downloading';operation=setInterval(()=>{p+=20;$('progress').value=p;if(p<100)return;clearInterval(operation);operation=null;$('cancel-update').hidden=true;$('progress').hidden=true;$('update').disabled=false;if(scenario===({'checking':'check-failed','downloading':'download-failed','installing':'install-failed'}[phase])&&retry!==phase){retry=phase;updateState='failed';$('notice').textContent=tx('演示失败，可重试当前步骤。','Simulated failure. Retry this step.')}else{updateState=phase==='checking'?(scenario==='current'?'current':'available'):phase==='downloading'?'downloaded':'installed';$('notice').textContent=u(updateState==='current'?'AboutCurrent':updateState==='available'?'AboutAvailable':updateState==='downloaded'?'AboutDownloaded':'AboutInstalled').replace('{0}','v12.0.11.0')+(updateState==='installed'?tx('（原型演示，未运行安装器）',' (prototype; no installer runs)'):'')}render()},180)};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(mode==='System')theme()});render();open('base64-string-converter');status(tx('就绪 · 本地工具工作区','Ready · Local tool workspace'));
</script></html>
