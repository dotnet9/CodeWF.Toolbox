<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>码匠工具箱 · 界面原型</title>
<style>
  :root { --bg:#f4f6fa; --panel:#ffffff; --line:#dfe4ee; --ink:#2b3040; --dim:#8a91a5; --accent:#3b6fe0; }
  * { box-sizing:border-box; margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { background:#d7dcea; padding:28px; display:flex; justify-content:center; }
  .win { width:1080px; height:660px; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,.16); display:flex; flex-direction:column; overflow:hidden; }
  .titlebar { height:38px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 12px; gap:10px; }
  .titlebar .logo { width:18px; height:18px; border-radius:5px; background:var(--accent); }
  .titlebar b { font-size:13px; }
  .titlebar .spacer { flex:1; }
  .titlebar .ghost { width:12px; height:12px; border-radius:50%; background:#e2e6f0; }
  .body { flex:1; display:flex; min-height:0; }
  .nav { width:200px; background:var(--panel); border-right:1px solid var(--line); padding:10px 8px; display:flex; flex-direction:column; gap:2px; }
  .nav .cap { font-size:10.5px; color:var(--dim); padding:8px 10px 4px; letter-spacing:.08em; }
  .nav i { font-style:normal; font-size:13px; padding:8px 12px; border-radius:8px; color:var(--ink); display:flex; gap:8px; align-items:center; cursor:default; }
  .nav i::before { content:""; width:14px; height:14px; border-radius:4px; background:#e6ebf7; }
  .nav i.on { background:#e8eefc; color:var(--accent); font-weight:600; }
  .nav i.on::before { background:var(--accent); }
  .main { flex:1; padding:16px 18px; display:flex; flex-direction:column; gap:14px; min-width:0; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:14px; }
  .card h4 { font-size:13px; margin-bottom:6px; }
  .card p { font-size:11.5px; color:var(--dim); line-height:1.5; }
  .tool { background:var(--panel); border:1px solid var(--line); border-radius:11px; flex:1; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .tool h3 { font-size:14px; }
  .io { display:flex; gap:10px; flex:1; min-height:0; }
  .io textarea { flex:1; border:1px solid var(--line); border-radius:9px; padding:10px; font:12px Consolas,monospace; color:var(--ink); resize:none; background:#fafbff; }
  .convert { align-self:center; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 22px; font-size:13px; }
  .foot { height:40px; border-top:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:12px; padding:0 14px; font-size:12px; color:var(--dim); }
  .foot .link { color:var(--accent); cursor:pointer; }
  .foot .spacer { flex:1; }
  .toast { position:absolute; bottom:56px; right:26px; background:#2f3542; color:#fff; font-size:12.5px; padding:10px 16px; border-radius:9px; opacity:0; transition:opacity .25s; }
  .toast.show { opacity:.94; }
  .win { position:relative; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><div class="logo"></div><b>码匠工具箱</b><div class="spacer"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div>
  <div class="body">
    <div class="nav">
      <div class="cap">工具</div>
      <i class="on">格式转换</i><i>JSON 工具</i><i>正则测试</i><i>时间戳</i>
      <div class="cap">模块</div>
      <i>日志查看</i><i>XML 翻译管理</i><i>安全工具</i>
      <div class="cap"></div>
      <i id="aboutNav">关于</i>
    </div>
    <div class="main">
      <div class="cards">
        <div class="card"><h4>格式转换</h4><p>JSON / XML / YAML / Markdown 互转，保留注释与顺序。</p></div>
        <div class="card"><h4>日志查看</h4><p>按级别区间过滤的本地日志查看器。</p></div>
        <div class="card"><h4>开发辅助</h4><p>时间戳、UUID、哈希、编解码等高频小工具。</p></div>
      </div>
      <div class="tool">
        <h3>JSON ⇄ XML</h3>
        <div class="io">
          <textarea>{"name":"CodeWF","version":"12.0.7","tags":["dev","toolbox"]}</textarea>
          <textarea placeholder="转换结果…"></textarea>
        </div>
        <button class="convert">转 换</button>
      </div>
    </div>
  </div>
  <div class="foot">
    <span>码匠工具箱 v12.0.7</span><span>·</span>
    <span class="link" id="checkUpdateBtn">检查更新</span><span>·</span>
    <span class="link">代码仓库</span>
    <div class="spacer"></div><span>Windows x64 · NativeAOT</span>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
  var toast = document.getElementById('toast');
  function say(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 2600); }
  document.getElementById('checkUpdateBtn').onclick = function(){
    say('正在检查更新…');
    setTimeout(function(){ say('当前已是最新版本'); }, 1200);
  };
  document.getElementById('aboutNav').onclick = function(){
    say('关于：码匠工具箱 — 面向开发者日常效率场景的模块化工具箱');
  };
</script>
</body>
</html>
