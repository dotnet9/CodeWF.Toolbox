function destination(){if(isPkg())return screenHeading('pkgDestination','pkgDestinationIntro')+`<div class="native-volume">${icon('drive',57)}<div><h3>${text('macVolume')}</h3><small>${text('macVolumeDetail')}</small></div>${icon('check',22)}</div><p class="hint-line">${icon('info',14)}<span>/Applications/${escape(product().name)}.app</span></p>`;const userDisabled=product().policy==='admin',allDisabled=product().policy==='user';return screenHeading('destinationTitle','destinationIntro')+`<div class="section-label">${text('scope')}</div><div class="scope-choices">${['user','all'].map(scope=>{const disabled=scope==='user'?userDisabled:allDisabled;return `<label class="choice${state.scope===scope?' selected':''}${disabled?' disabled':''}"><input type="radio" name="scope" value="${scope}" ${state.scope===scope?'checked':''}${disabled?' disabled':''}><span>${text(scope==='user'?'userScope':'allScope')}<small>${text(scope==='user'?'userScopeDetail':'allScopeDetail')}</small></span></label>`}).join('')}</div>${product().policy==='flex'?'':`<p class="hint-line">${icon('info',13)}<span>${text(userDisabled?'adminOnly':'userOnly')}</span></p>`}<label class="section-label" for="installPath" style="display:block">${text('path')}</label><div class="field-row"><input id="installPath" value="${escape(state.path)}" aria-invalid="${!!pathError()}" aria-describedby="pathError" spellcheck="false">${button('browse','browse')}</div><p class="field-error" id="pathError">${escape(pathError())}</p><div class="space-info"><span>${text('spaceRequired')}：${text('spaceValue')}</span><span>${text('spaceFree')}</span></div>`}

function renderLinux(){const installed=['maintenance','complete'].includes(state.step),removed=state.step==='removed',running=busy();return `<div class="native-shell"><div class="finder-toolbar"><span>${icon('back',15)}<span style="margin-left:13px">${text('localPackage')}</span></span><span class="tag">DEB</span></div><main class="linux-content" data-step="${state.step}"><div class="linux-head"><div class="linux-product">${productIcon()}<div><h2 class="hero-name">${escape(product().name)}</h2><p class="hero-tagline">${escape(product()[state.language])}</p><div class="tags"><span class="tag">MIT</span><span class="tag">${escape(state.arch==='arm64'?'arm64':'amd64')}</span>${installed?`<span class="tag" style="color:var(--success)">${icon('check',11)}${text('linuxInstalled')}</span>`:''}</div></div></div><div class="linux-action">${running?button('cancel','cancel'):installed?button('linuxRemove','linux-remove',{symbol:'trash'}):button('install','linux-install',{primary:true,symbol:'cube'})}</div></div><div class="linux-info"><div><label>${text('packageVersion')}</label>${escape(product().version)}</div><div><label>${text('packageArchitecture')}</label>${escape(state.arch==='arm64'?'arm64':'amd64')}</div><div><label>${text('packageSize')}</label>${text('spaceValue')}</div><div><label>${text('packageSource')}</label>${text('localFile')}</div></div>${running?`<div class="linux-progress"><div class="progress-heading"><div class="progress-title">${escape(text(state.operation==='uninstall'?'uninstallTitle':'installTitle'))}</div><span class="percent"><span id="progressPercent">${state.progress}</span><small>%</small></span></div><div class="progress-track" role="progressbar" aria-label="${text('progressLabel')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.progress}" id="progressBar"><div class="progress-fill" id="progressFill" style="width:${state.progress}%"></div></div></div>`:state.step==='error'?`<div class="error-detail">${text('errorCode')}<div class function renderModal(){if(!state.modal)return '';if(state.modal==='replace')return replaceDialog();if(state.modal==='browse')return `<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${icon('folder',22)}${text('browseTitle')}</h3><p>${text('browseIntro')}</p><div class="picker-options">${['C:\\Apps\\','D:\\Apps\\'].map(path=>`<button data-action="pick-folder" data-path="${escape(path+product().name)}">${icon('drive',23)}<span>${escape(path+product().name)}</span></button>`).join('')}</div><div class="actions">${button('cancel','modal-dismiss')}</div></section></div>`;if(state.modal==='cancel')return `<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${icon('alert',23)}${text('cancelTitle')}</h3><p>${text('cancelBody')}</p><div class="actions">${button('keepInstalling','modal-dismiss')}${button('stopInstalling','stop',{primary:true})}</div></section></div>`;const windows=state.platform==='windows';return `<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${icon(windows?'shield':'lock',24)}${text(windows?'authTitle':state.platform==='linux'?'authLinuxTitle':'pkgAuthTitle')}</h3><p>${escape(text(windows?'authQuestion':state.platform==='linux'?'authLinuxBody':'pkgAuthBody'))}</p><div class="dialog-meta"><strong>${escape(product().name)}</strong>${windows?`<br>${text('unknownPublisher')}<br>${text('authSource')}`:`<br>${text('authDemo')}`}</div>${windows?'':`<label for="previewPassword">${text('password')}</label><input id="previewPassword" class="input-field" type="password" readonly value="preview" aria-readonly="true">`}<div class="actions">${button(windows?'deny':'cancel','modal-dismiss')}${button(windows?'allow':'authenticate','authorize',{primary:true,id:'authorizeButton'})}</div></section></div>`}
/* 同平台更新只替换变化区域，核心与 Canvas 保持原实例和动画时间轴。 */
function renderWindow(frame,markup){
 const template=document.createElement('template');template.innerHTML=markup;
 if(state.platform!=='windows'||!frame.querySelector('.wizard:not(.pkg)')){frame.replaceChildren(template.content);return}

 for(const selector of ['.titlebar','.side-brand','.side-product','.side-meta','.steps','.side-foot','.footer'])replaceChanged(selector);
 const oldScreen=frame.querySelector('.screen'),newScreen=template.content.querySelector('.screen');

 if(oldScreen.innerHTML!==newScreen.innerHTML)oldScreen.replaceChildren(...newScreen.childNodes);

 if(oldModal&&newModal){if(oldModal.outerHTML!==newModal.outerHTML)oldModal.replaceWith(newModal)}else if(oldModal)oldModal.remove();else if(newModal)frame.append(newModal);

function render(){const active=document.activeElement?.id;document.documentElement.lang=state.language==='zh'?'zh-CN':'en';const systemDark=matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=state.theme==='system'?(systemDark?'dark':'light'):state.theme;document.documentElement.dataset.reduced=String(state.reduced);document.title=product().name+(state.language==='zh'?' · CodeWF 安装器原型':' · CodeWF Installer prototype');document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=text(node.dataset.i18n));$('productSelect').innerHTML=products.map(item=>`<option value="${item.id}"${state.product===item.id?' selected':''}>${escape(item.name)}</option>`).join('');$('productSelect').setAttribute('aria-label',text('product'));$('platforms').innerHTML=[['windows','Windows','windows'],['macos','macOS','laptop'],['linux','Linux','terminal']].map(([platform,name,symbol])=>`<button type="button" data-platform="${platform}" aria-pressed="${state.platform===platform}">${icon(symbol,15)}${name}</button>`).join('');$('platforms').setAttribute('aria-label',text('platform'));$('archSelect').innerHTML=(state.platform==='windows'?['x64']:['arm64','x64']).map(arch=>`<option value="${arch}"${state.arch===arch?' selected':''}>${arch==='arm64'&&state.platform==='macos'?'Apple Silicon':arch==='x64'&&state.platform==='macos'?'Intel':arch.toUpperCase()}</option>`).join('');$('archSelect').disabled=state.platform==='windows';$('archSelect').setAttribute('aria-label',text('architecture'));$('themeButton').innerHTML=icon(state.theme==='system'?'system':state.theme==='dark'?'moon':'sun',17);$('themeButton').title=text('theme'+state.theme[0].toUpperCase()+state.theme.slice(1));$('themeButton').setAttribute('aria-label',$('themeButton').title);$('languageButton').innerHTML=icon('globe',15)+(state.language==='zh'?'English':'简体中文');$('languageButton').setAttribute('aria-label',state.language==='zh'?'Switch to English':'切换到简体中文');$('resetButton').innerHTML=icon('reset',14)+text('reset');$('prototypeToolbar').setAttribute('aria-label',text('prototypeControls'));$('stageButtons').setAttribute('aria-label',text('stepsPreview'));$('scenarioSelect').innerHTML=[['new','newInstall'],['installed','installed'],['error','failure']].map(([value,key])=>`<option value="${value}"${state.scenario===value?' selected':''}>${text(key)}</option>`).join('');$('scenarioSelect').setAttribute('aria-label',text('scenarioLabel'));$('platformCaption').textContent=state.platform==='windows'?'WINDOWS SETUP':state.platform==='linux'?'LINUX PACKAGE':isPkg()?'macOS INSTALLER':'macOS DISK IMAGE';$('formatCaption').textContent=text(state.platform==='windows'?'windowsFormat':state.platform==='linux'?'linuxFormat':isPkg()?'pkgFormat':'macFormat');$('proposalNote').textContent=text(state.platform==='windows'?'sculptedNote':'proposalNote');$('reducedMotion').checked=state.reduced;const window=$('installerWindow');window.dataset.installerPlatform=state.platform;window.dataset.step=state.step;for(const phase of ['installing','repairing','uninstalling','complete'])window.classList.toggle(phase,state.step===phase);$('effectsButton').innerHTML=icon('play',13)+'<span>'+text('effectsPreview')+'</span>';$('effectsButton').hidden=state.platform!=='windows';window.classList.toggle('hidden-window',state.closed);window.classList.toggle('minimized',state.minimized);window.setAttribute('aria-label',text('preview'));renderWindow(window,titlebar()+(isDmg()?renderDmg():state.platform==='linux'?renderLinux():renderWizard())+renderModal());document.querySelectorAll('[data-brand-link]').forEach(link=>link.setAttribute('aria-label',text('brandLink')));$('restore').classList.toggle('show',state.closed);$('stageButtons').innerHTML=(isDmg()?['welcome','copying','complete']:state.platform==='linux'?['welcome','installing','complete','removed','error']:['welcome','license','destination',...(isPkg()?[]:['options']),'ready','installing','complete','maintenance','remove','error']).map(step=>`<button type="button" data-jump="${step}" class="${state.step===step?'active':''}"${state.step===step?' aria-current="step"':''}>${escape(text(step==='copying'?'installing':step==='removed'?'remove':step))}</button>`).join('');if(state.platform==='macos'&&isPkg())$('stageButtons').insertAdjacentHTML('beforeend',`<button data-action="mode-dmg">DMG</button>`);lastStep=state.step;updateProgress();if(active&&$(active))$(active).focus({preventScroll:true});if(window.querySelector('.dialog')){const dialog=[...window.querySelectorAll('.dialog')].at(-1);(dialog.querySelector('button:not([disabled])')||dialog).focus({preventScroll:true})}bindDrag();syncEffects()}
function updateProgress(){$('installerWindow').style.setProperty('--install-progress',String(busy()?state.progress/100:['complete','removed'].includes(state.step)?1:.04));if($('reactorLabel'))$('reactorLabel').innerHTML=['complete','removed'].includes(state.step)?icon('check',37):busy()?state.progress+'<small style="font-size:12px;letter-spacing:0">%</small>':'CodeWF';if($('progressPercent'))$('progressPercent').textContent=state.progress;if($('progressFill'))$('progressFill').style.width=state.progress+'%';if($('progressBar'))$('progressBar').setAttribute('aria-valuenow',state.progress);const index=Math.min(3,Math.floor(state.progress/26));if($('progressPhase'))$('progressPhase').textContent=text(['phaseFiles','phaseShortcuts','phaseRegistration','phaseFinish'][index]);document.querySelectorAll('[data-phase]').forEach(node=>{const phase=Number(node.dataset.phase);node.className='phase '+(phase<index?'done':phase===index?'active':'');const symbol=node.querySelector('.phase-symbol'),mode=phase<index?'done':phase===index?'active':'pending';if(symbol.dataset.phaseState!==mode){symbol.dataset.phaseState=mode;symbol.innerHTML=phase<index?icon('check',15):phase===index?'<span class="spinner"></span>':'<span style="width:5px;height:5px;background:var(--line);border-radius:50%"></span>'}})}
function startOperation(operation){stopTimer();state.modal=null;state.operation=operation;state.progress=0;state.step=operation==='copy'?'copying':operation==='repair'?'repairing':operation==='uninstall'?'uninstalling':'installing';render();operationTimer=setInterval(()=>{if(state.modal||state.closed||state.minimized)return;state.progress=Math.min(100,state.progress+5);if(state.scenario==='error'&&!state.failureConsumed&&state.progress>=45){state.failureConsumed=true;stopTimer();state.step='error';render();return}if(state.progress>=100){stopTimer();state.step=operation==='uninstall'?'removed':'complete';render();if(operation==='copy')toast('macCopied')}else updateProgress()},180)}
function requestInstall(operation='install'){state.operation=operation;if(state.platform==='linux'||isPkg()||state.scope==='all'){state.modal='auth';render()}else startOperation(operation)}
function next(){if(state.step==='welcome')state.step='license';else if(state.step==='license'&&state.accepted)state.step='destination';else if(state.step==='destination'&&!pathError())state.step=isPkg()?'ready':'options';else if(state.step==='options')state.step='ready';else if(state.step==='ready'){requestInstall();return}render();$('screen')?.focus({preventScroll:true})}
function back(){if(state.step==='remove'){state.step='maintenance'}else{const index=currentSteps().indexOf(state.step);state.step=currentSteps()[Math.max(0,index-1)]}render();$('screen')?.focus({preventScroll:true})}
function jump(step){stopTimer();state.modal=null;state.closed=false;state.minimized=false;if(step==='copying'){startOperation('copy');return}state.step=step;if(['installing','repairing','uninstalling'].includes(step)){startOperation(step==='repairing'?'repair':step==='uninstalling'?'uninstall':'install');return}if(step==='complete')state.operation='install';render()}
function action(name,target){switch(name){case'next':next();break;case'back':back();break;case'cancel':if(busy()){state.modal='cancel';render()}else{state.closed=true;render();toast('closed')}break;case'window-close':if(busy()){state.modal='cancel';render()}else{state.closed=true;render();toast('closed')}break;case'window-minimize':state.minimized=!state.minimized;render();break;case'finish':state.closed=true;render();toast(state.launch&&state.step!=='removed'?'launched':'closed');break;case'browse':state.modal='browse';render();break;case'pick-folder':state.path=target.dataset.path;state.modal=null;render();toast('picked');break;case'modal-dismiss':state.modal=null;render();break;case'authorize':startOperation(state.operation);break;case'stop':stopTimer();state.modal=null;state.step='welcome';state.progress=0;render();toast('stopped');break;case'choose-repair':state.maintenance='repair';render();break;case'choose-uninstall':state.maintenance='uninstall';render();break;case'maintain':if(state.maintenance==='repair')requestInstall('repair');else{state.step='remove';render()}break;case'uninstall':requestInstall('uninstall');break;case'retry':requestInstall(state.operation);break;case'change-location':state.step='destination';render();break;case'linux-install':requestInstall('install');break;case'linux-remove':requestInstall('uninstall');break;case'copy':if(!busy())requestCopy();break;case'replace':startOperation('copy');break;case'select-app':target.focus();break;case'eject':stopTimer();state.closed=true;render();toast('ejected');break;case'mode-pkg':state.macMode='pkg';resetFlow();break;case'mode-dmg':state.macMode='dmg';resetFlow();break}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action],[data-platform],[data-jump]');if(!target||target.disabled)return;if(target.dataset.platform){state.platform=target.dataset.platform;state.arch=state.platform==='macos'?'arm64':'x64';resetFlow()}else if(target.dataset.jump)jump(target.dataset.jump);else action(target.dataset.action,target)});
document.addEventListener('change',event=>{const input=event.target;if(input.name==='scope'){state.scope=input.value;state.path=defaultPath();render()}else if(input.id==='productSelect'){state.product=input.value;resetFlow()}else if(input.id==='archSelect'){state.arch=input.value;render()}else if(input.id==='scenarioSelect'){state.scenario=input.value;resetFlow({keepScenario:true})}else if(input.id==='licenseAccepted'){state.accepted=input.checked;$('primaryAction').disabled=!state.accepted}else if(input.id==='desktopShortcut')state.desktop=input.checked;else if(input.id==='fileAssociations')state.association=input.checked;else if(input.id==='launchApp')state.launch=input.checked;else if(input.id==='keepData'){state.keepData=input.checked;render()}else if(input.id==='reducedMotion'){state.reduced=input.checked;document.documentElement.dataset.reduced=String(state.reduced);syncEffects()}});
document.addEventListener('input',event=>{if(event.target.id==='installPath'){state.path=event.target.value;const error=pathError();$('pathError').textContent=error;event.target.setAttribute('aria-invalid',String(!!error));$('primaryAction').disabled=!!error}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.modal){state.modal=null;render()}else if(busy()){state.modal='cancel';render()}else{state.closed=true;render()}event.preventDefault();return}const dialog=[...document.querySelectorAll('.dialog')].at(-1);if(event.key==='Tab'&&dialog){const controls=[...dialog.querySelectorAll('button:not([disabled]),input:not([readonly]),[tabindex="0"]')];if(controls.length){const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault()}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault()}}}if(event.key==='Enter'&&event.target.id==='dmgApp'){event.preventDefault();requestCopy()}else if(event.altKey&&event.key==='ArrowLeft'){event.preventDefault();if(!busy()&&!state.modal)back()}else if(event.key==='Enter'&&event.target.id==='installPath'&&!pathError()){event.preventDefault();next()}});
function bindDrag(){const app=$('dmgApp'),folder=$('applicationsTarget');if(!app||!folder)return;app.addEventListener('dragstart',event=>{event.dataTransfer.setData('text/plain','codewf-app');event.dataTransfer.effectAllowed='copy'});folder.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='copy';folder.classList.add('drag-over')});folder.addEventListener('dragleave',()=>folder.classList.remove('drag-over'));folder.addEventListener('drop',event=>{event.preventDefault();folder.classList.remove('drag-over');if(event.dataTransfer.getData('text/plain')==='codewf-app')requestCopy()})}

/* 单个绘制循环；减少动态效果、隐藏页面和关闭窗口时停止，避免后台持续占用。 */
let effectFrame=0,effectCanvas=null,effectContext=null,effectLastTime=0,particleTime=0,activityLevel=0;
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
function drawReactor(now,animated){
 const canvas=$('reactorCanvas');if(!canvas)return;
 if(canvas!==effectCanvas){effectCanvas=canvas;effectContext=canvas.getContext('2d');const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*ratio);canvas.height=Math.round(canvas.clientHeight*ratio);effectContext.setTransform(ratio,0,0,ratio,0,0)}
 const context=effectContext;if(!context)return;
 const width=canvas.clientWidth,height=canvas.clientHeight,cx=width/2,cy=height/2;
 context.clearRect(0,0,width,height);
 const active=busy(),done=['complete','removed'].includes(state.step),delta=animated&&effectLastTime?Math.min(Math.max((now-effectLastTime)/1000,0),.05):0;
 effectLastTime=animated?now:0;if(animated){activityLevel+=(Number(active)-activityLevel)*(1-Math.exp(-delta*5));particleTime+=delta*(.045+activityLevel*.195)}
 const time=animated?particleTime:0,energy=animated?activityLevel:Number(active);
 const glow=context.createRadialGradient(cx,cy,8,cx,cy,94);glow.addColorStop(0,active?'#d3b7ff36':'#a78bfa22');glow.addColorStop(1,'#512bd400');context.fillStyle=glow;context.fillRect(0,0,width,height);
 for(let i=0;i<64;i++){
  const seed=(i*.61803398875)%1,phase=(time+seed)%1,angle=i*2.39996+time*1.5,radius=(75+seed*50)*(1-energy)+(110-phase*80)*energy;
  const x=cx+Math.cos(angle)*radius,y=cy+Math.sin(angle)*radius*.69;
  const alpha=(.16+seed*.3)*(1-energy)+Math.sin(phase*Math.PI)*.65*energy;
  context.fillStyle=`rgba(225,207,255,${alpha})`;context.beginPath();context.arc(x,y,i%7===0?1.5:.75,0,Math.PI*2);context.fill();
  if(energy>.01){context.strokeStyle=`rgba(196,163,255,${alpha*.42})`;context.lineWidth=.7;context.beginPath();context.moveTo(x,y);context.lineTo(x+Math.cos(angle)*7,y+Math.sin(angle)*4);context.stroke()}
 }
 if(done){context.strokeStyle='#e4d4ff66';context.lineWidth=.8;context.beginPath();context.arc(cx,cy,83,0,Math.PI*2);context.stroke()}
}
function syncEffects(){
 const visible=state.platform==='windows'&&!state.closed&&!state.minimized&&!document.hidden;
 const animated=visible&&!state.reduced&&!motionPreference.matches;
 if(!animated){if(effectFrame)cancelAnimationFrame(effectFrame);effectFrame=0;effectLastTime=0;if(visible)drawReactor(0,false);return}
 if(!effectFrame){const frame=now=>{drawReactor(now,true);effectFrame=requestAnimationFrame(frame)};effectLastTime=0;effectFrame=requestAnimationFrame(frame)}
}
document.addEventListener('visibilitychange',syncEffects);
motionPreference.addEventListener('change',syncEffects);
window.addEventListener('resize',()=>{effectCanvas=null;syncEffects()});
const effectsPreviewButton=document.createElement('button');effectsPreviewButton.id='effectsButton';effectsPreviewButton.type='button';effectsPreviewButton.className='effects-button';document.querySelector('.toolbar-right').prepend(effectsPreviewButton);effectsPreviewButton.addEventListener('click',()=>jump('installing'));

$('themeButton').addEventListener('click',()=>{state.theme=['light','dark','system'][(['light','dark','system'].indexOf(state.theme)+1)%3];render()});$('languageButton').addEventListener('click',()=>{state.language=state.language==='zh'?'en':'zh';render()});$('resetButton').addEventListener('click',()=>{resetFlow();toast('resetDone')});$('restoreButton').addEventListener('click',()=>{state.closed=false;state.minimized=false;render();toast('restored')});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')render()});$('brandIcon').innerHTML=icon('cube',22);$('productIcon').innerHTML=icon('cube',15);for(const id of ['productChevron','archChevron','scenarioChevron'])$(id).innerHTML=icon('chevron',12);$('restoreIcon').innerHTML=icon('cube',42);
/* 自动审计只操作这份可观察状态，不调用系统安装接口。 */
window.CodeWFInstallerPrototype={get state(){return {...state}},get products(){return products.map(({id,name,version,policy})=>({id,name,version,policy}))},get config(){return {...prototypeConfig}},set(options){stopTimer();for(const key of ['language','theme','platform','macMode','product','arch','scenario','reduced'])if(options[key]!==undefined)state[key]=options[key];resetFlow({keepScenario:true});if(options.step)jump(options.step)},jump,reset:resetFlow};
