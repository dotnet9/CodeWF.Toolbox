<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Prism module lifecycle</title>
  <desc id="desc">How a CodeWF Toolbox module registers menu entries and views before user navigation.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { fill: #111827; font: 700 26px "Segoe UI", Arial, sans-serif; }
      .step { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .step-title { fill: #0f172a; font: 700 16px "Segoe UI", Arial, sans-serif; }
      .text { fill: #475569; font: 400 13px "Segoe UI", Arial, sans-serif; }
      .num { fill: #2563eb; font: 700 18px "Segoe UI", Arial, sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .region { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 12; }
      .menu { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .module { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" width="960" height="500" />
  <text class="title" x="48" y="54">Prism Module Lifecycle</text>

  <rect class="step" x="56" y="96" width="230" height="108" rx="12" />
  <text class="num" x="82" y="130">1</text>
  <text class="step-title" x="116" y="130">Catalog</text>
  <text class="text" x="82" y="158">App.ConfigureModuleCatalog</text>
  <text class="text" x="82" y="180">adds MainModule and feature modules.</text>

  <rect class="module" x="364" y="96" width="230" height="108" rx="12" />
  <text class="num" x="390" y="130">2</text>
  <text class="step-title" x="424" y="130">Module Constructor</text>
  <text class="text" x="390" y="158">Register groups and tools through</text>
  <text class="text" x="390" y="180">IToolMenuService.</text>

  <rect class="region" x="672" y="96" width="230" height="108" rx="12" />
  <text class="num" x="698" y="130">3</text>
  <text class="step-title" x="732" y="130">OnInitialized</text>
  <text class="text" x="698" y="158">Register views with</text>
  <text class="text" x="698" y="180">RegionNames.ContentRegion.</text>

  <rect class="menu" x="210" y="292" width="230" height="108" rx="12" />
  <text class="num" x="236" y="326">4</text>
  <text class="step-title" x="270" y="326">User Chooses Tool</text>
  <text class="text" x="236" y="354">Menu search filters entries.</text>
  <text class="text" x="236" y="376">Selection publishes command.</text>

  <rect class="region" x="520" y="292" width="230" height="108" rx="12" />
  <text class="num" x="546" y="326">5</text>
  <text class="step-title" x="580" y="326">Region Navigation</text>
  <text class="text" x="546" y="354">Prism displays the target view.</text>
  <text class="text" x="546" y="376">ViewModel handles tool behavior.</text>

  <path class="arrow" d="M286 150 L360 150" />
  <path class="arrow" d="M594 150 L668 150" />
  <path class="arrow" d="M786 206 C786 248 704 260 636 288" />
  <path class="arrow" d="M442 346 L516 346" />
  <path class="arrow" d="M326 292 C300 254 324 226 388 198" />
</svg>
